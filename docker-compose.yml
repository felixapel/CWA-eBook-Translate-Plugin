version: '3.8'

services:
  calibre-web:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/cwa:/config
      - ./books:/calibre-library
      - ./ingest:/cwa-book-ingest
      # Inject the translator plugin files
      - ./overlay/read.html:/app/calibre-web-automated/cps/templates/read.html:ro
      - ./overlay/translator.js:/app/calibre-web-automated/cps/static/js/translator.js:ro
      - ./overlay/translator.css:/app/calibre-web-automated/cps/static/css/translator.css:ro
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - webnet

  book-translator-api:
    build: .
    image: local/book-translator-api:latest
    container_name: book-translator-api
    environment:
      - LLM_PROVIDER=local
      - LLM_MODEL=gemma4-12b
      - LLM_API_KEY=
      # If using an external proxy, ensure CORS is handled or map correctly
    volumes:
      - ./config/translator:/app/data
    ports:
      - "8390:8390"
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
